[package]
name = "shepherd"
version = "0.1.0"
edition = "2024"
description = "ScottyLabs terminal project boards and agent handoffs"
license = "AGPL-3.0-or-later"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
fs2 = "0.4.3"
nix = { version = "0.32.0", features = ["signal", "process"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tempfile = "3.27.0"
