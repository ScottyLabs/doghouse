[package]
name = "doghouse"
version = "0.1.0"
edition = "2024"
description = "ScottyLabs terminal project boards and agent handoffs"
license = "AGPL-3.0-or-later"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
collar = { git = "https://git.cmu.dev/ScottyLabs/collar", rev = "cc937a82735ef8f2454aea8e0bd4e2a1ec72bebd", version = "0.1.0" }
crossterm = "0.29.0"
fs2 = "0.4.3"
nix = { version = "0.32.0", features = ["signal", "process", "term"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tempfile = "3.27.0"

[dev-dependencies]
tiny_http = "0.12.0"
